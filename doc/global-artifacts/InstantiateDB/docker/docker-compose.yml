version: '3.8'

services:
  oracle-xe:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle21c-xe
    ports:
      - "1521:1521"   # Listener SQL*Net
      - "5500:5500"   # Oracle EM Express
    environment:
      - ORACLE_PWD=admin   # SYS, SYSTEM, PDBADMIN inicial
    volumes:
      - oracle-xe-data:/opt/oracle/oradata
      - ./setup:/opt/oracle/scripts/setup   # <- aqui a magia acontece
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 30

volumes:
  oracle-xe-data: